name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo build --workspace
      - run: cargo test --workspace

  manager:
    # Python の navigation_manager(標準ライブラリだけ)の単体テスト。Windows でも動かす(地図のパスの扱いなど)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: cd manager && python -m unittest discover -s tests -v
      - run: python -m compileall -q manager scripts

  stack:
    # pip で入れた navigation-manager の stack コマンドで、公開版の .juizapp だけから一式を起動し、ゴールに着くまでを確かめる。
    # 演習(公式サイト)と同じ手順。Windows・macOS でも動かす。navigation_hub は Releases のもの(HUB_VERSION)を使う
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-15]
    runs-on: ${{ matrix.os }}
    env:
      HUB_VERSION: "0.2.0"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install juiz and navigation-manager
        run: python -m pip install "juiz-cli==$(sed -n 's/^juiz_sdk = "=\(.*\)"/\1/p' Cargo.toml)" ./manager
      - name: Get the apps
        run: |
          scripts/fetch_apps.sh deps
          curl -fsSL --retry 3 -o "deps/navigation_hub-$HUB_VERSION.juizapp" \
            "https://github.com/OpenJUIZ/navigation_manager/releases/download/v$HUB_VERSION/navigation_hub-$HUB_VERSION.juizapp"
      - name: navigation-manager stack --test (mobile_sim map)
        run: navigation-manager stack deps/*.juizapp --test --logdir stack_logs/mobile_sim
      - name: navigation-manager stack --test (SLAM map)
        run: |
          navigation-manager stack deps/*.juizapp --test --logdir stack_logs/slam \
            --map manager/tests/data/slam_map/map.yaml --goal 3.0,-1.5,0.0
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack_logs-${{ matrix.os }}
          path: stack_logs
          if-no-files-found: ignore

  smoke:
    # juiz で app/smoke_test.conf を起動し、navigation_hub のプラグインを読み込んで nav_relay を HTTP から呼ぶ。
    # プラグインは C ABI なので、pip の juiz-cli(別の rustc でビルドした juiz)でそのまま読める
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install juiz
        run: pip install "juiz-cli==$(sed -n 's/^juiz_sdk = "=\(.*\)"/\1/p' Cargo.toml)"
      - run: scripts/dev_plugin.sh
      - run: python3 scripts/smoke_test.py

  m0-topic-relay:
    # M0 の実験を再現する(葉どうしは届かず、manager が別名で出し直せば届く)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: experiments/m0_topic_relay/probe
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install juiz
        run: pip install "juiz-cli==$(sed -n 's/^juiz_sdk = "=\(.*\)"/\1/p' Cargo.toml)"
      - run: cd experiments/m0_topic_relay/probe && cargo build
      - name: plain (amcl does not get odom)
        run: |
          experiments/m0_topic_relay/run.sh plain | tee plain.txt
          grep -q "^manager .*odom x" plain.txt
          ! grep -q "^amcl .*odom x" plain.txt
      - name: relay (amcl gets nav/odom)
        run: |
          experiments/m0_topic_relay/run.sh relay | tee relay.txt
          grep -q "^amcl .*odom x" relay.txt

  e2e:
    # ナビゲーション一式を navigation_hub を根にした木の形で起動し、Python の navigation_manager からゴールを出して
    # 着くまでと、キャンセルで止まることを確かめる。
    # mobile_sim・planner_dijkstra・planner_dwa は main をビルドし、localization_amcl(C++)はリリースの .juizapp を使う。
    # map: mobile_sim は mobile_sim の地図を配る。slam は SLAM(mapper_gmapping)で作った地図を --map で配り、扉を抜けて右の部屋へ行く
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - map: mobile_sim
            args: ""
          - map: slam
            args: "--map manager/tests/data/slam_map/map.yaml --goal 3.0,-1.5,0.0"
    env:
      AMCL_VERSION: "0.1.1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with: { repository: OpenJUIZ/mobile_sim, path: deps/mobile_sim }
      - uses: actions/checkout@v4
        with: { repository: OpenJUIZ/planner_dijkstra, path: deps/planner_dijkstra }
      # planner_dwa は private なので、読める token(secrets.DEPS_TOKEN)が要る。public にすれば無くてよい
      - uses: actions/checkout@v4
        with:
          repository: OpenJUIZ/planner_dwa
          path: deps/planner_dwa
          token: ${{ secrets.DEPS_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            deps/mobile_sim
            deps/planner_dijkstra
            deps/planner_dwa
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install juiz
        run: pip install pyyaml "juiz-cli==$(sed -n 's/^juiz_sdk = "=\(.*\)"/\1/p' Cargo.toml)"
      - name: Build plugins
        run: |
          scripts/dev_plugin.sh
          deps/mobile_sim/scripts/dev_plugin.sh
          deps/planner_dijkstra/scripts/dev_plugin.sh
          deps/planner_dwa/scripts/dev_plugin.sh
      - name: Get localization_amcl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "v$AMCL_VERSION" -R OpenJUIZ/localization_amcl -p "*.juizapp" -D deps
          mkdir -p deps/localization_amcl && unzip -q deps/localization_amcl-*.juizapp -d deps/localization_amcl
      - name: End-to-end (goal -> plan -> follow -> arrive)
        run: |
          python3 scripts/run_stack.py --test --logdir stack_logs ${{ matrix.args }} \
            --mobile-sim deps/mobile_sim/app --amcl deps/localization_amcl \
            --planner deps/planner_dijkstra/app --dwa deps/planner_dwa/app
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stack_logs-${{ matrix.map }}
          path: stack_logs
          if-no-files-found: ignore
