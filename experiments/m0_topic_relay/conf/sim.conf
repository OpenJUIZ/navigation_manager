name: sim
option:
  http_broker:
    start: true
    port: 8101
plugins:
  components:
    nav_probe:
      language: rust
      path: "../probe/target/debug"
processes:
  - type_name: src_odom
    name: s
    use_memo: false
    publishes:
      - odom
  - type_name: echo_cmd_vel
    name: r1
    use_memo: false
    subscribes:
      arg1: cmd_vel
ecs:
  - type_name: main_loop_ec
    name: ec0
    rate: 1.0
    bind:
      - type_name: src_odom
        name: s
    auto_start: true
