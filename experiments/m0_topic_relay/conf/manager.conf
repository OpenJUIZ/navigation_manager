name: manager
option:
  http_broker:
    start: true
    port: 8100
plugins:
  components:
    nav_probe:
      language: rust
      path: "../probe/target/debug"
subsystems:
  - type_name: http
    name: "localhost:8101"
  - type_name: http
    name: "localhost:8102"
  - type_name: http
    name: "localhost:8103"
  - type_name: http
    name: "localhost:8104"
processes:
  - type_name: src_goal
    name: s
    use_memo: false
    publishes:
      - goal
  - type_name: echo_amcl_pose
    name: r1
    use_memo: false
    subscribes:
      arg1: amcl_pose
  - type_name: echo_path
    name: r2
    use_memo: false
    subscribes:
      arg1: path
  - type_name: echo_odom
    name: r3
    use_memo: false
    subscribes:
      arg1: odom
ecs:
  - type_name: main_loop_ec
    name: ec0
    rate: 1.0
    bind:
      - type_name: src_goal
        name: s
    auto_start: true
