name: planner
option:
  http_broker:
    start: true
    port: 8103
plugins:
  components:
    nav_probe:
      language: rust
      path: "../probe/target/debug"
processes:
  - type_name: src_path
    name: s
    use_memo: false
    publishes:
      - path
  - type_name: echo_amcl_pose
    name: r1
    use_memo: false
    subscribes:
      arg1: amcl_pose
  - type_name: echo_goal
    name: r2
    use_memo: false
    subscribes:
      arg1: goal
ecs:
  - type_name: main_loop_ec
    name: ec0
    rate: 1.0
    bind:
      - type_name: src_path
        name: s
    auto_start: true
