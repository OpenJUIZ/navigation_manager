name: amcl
option:
  http_broker:
    start: true
    port: 8102
plugins:
  components:
    nav_probe:
      language: rust
      path: "../probe/target/debug"
processes:
  - type_name: src_amcl_pose
    name: s
    use_memo: false
    publishes:
      - amcl_pose
  - type_name: echo_odom
    name: r1
    use_memo: false
    subscribes:
      arg1: odom
ecs:
  - type_name: main_loop_ec
    name: ec0
    rate: 1.0
    bind:
      - type_name: src_amcl_pose
        name: s
    auto_start: true
