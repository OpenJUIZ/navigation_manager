# 確認用: subsystem なしで app.conf と同じ Process を立て、HTTP から呼べることを確かめる(scripts/smoke_test.py)
"name": "navigation_hub_smoke"
"option":
  "http_broker":
    "start": true
    "port": 8016
"plugins":
  "components":
    "navigation_hub":
      "language": "rust"
      "path": "plugins/{target}"
"processes":
  - { "type_name": "nav_relay", "name": "relay_odom", "use_memo": false, "subscribes": { "value": "odom" }, "publishes": ["nav/odom"] }
