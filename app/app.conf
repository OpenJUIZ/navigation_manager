# navigation_hub の起動設定
#   ナビゲーション一式の木の根。localization_amcl(その下に mobile_sim)・planner_dijkstra・planner_dwa を subsystem に持ち、
#   葉どうしのトピックを受けて別の名前で出し直す(juiz 0.2.4 では葉どうしの間で中継されないため。experiments/m0_topic_relay)。
#   ゴール・引き直し・キャンセル・初期位置などの判断は、Python の navigation_manager(manager/、HTTP 8005)が各アプリを HTTP で呼んで行う。
#
#   起動の順(根は最後。先に起動すると葉につながらない): scripts/run_stack.py を参照
#
#   木の形:
#     navigation_hub ─┬─ localization_amcl ── mobile_sim
#                     ├─ planner_dijkstra
#                     └─ planner_dwa
"name": "navigation_hub"
"option":
  "http_broker":
    "start": true
    "port": 8006
"brokers":
  - "type_name": "ipc"
    "name": "navigation_hub"
"subsystems":
  - "package": "localization_amcl"
    "type_name": "ipc"
    "name": "localization_amcl"
  - "type_name": "ipc"
    "name": "planner_dijkstra"
  - "type_name": "ipc"
    "name": "planner_dwa"
"plugins":
  "components":
    "navigation_hub":
      "language": "rust"
      "path": "plugins/{target}"
"processes":
  # mobile_sim のセンサー → planner_dwa
  - { "type_name": "nav_relay", "name": "relay_odom", "use_memo": false, "subscribes": { "value": "odom" }, "publishes": ["nav/odom"] }
  - { "type_name": "nav_relay", "name": "relay_scan", "use_memo": false, "subscribes": { "value": "scan" }, "publishes": ["nav/scan"] }
  - { "type_name": "nav_relay", "name": "relay_lidar_mount", "use_memo": false, "subscribes": { "value": "lidar_mount" }, "publishes": ["nav/lidar_mount"] }
  # localization_amcl の推定姿勢 → planner_dijkstra(始点)・planner_dwa
  - { "type_name": "nav_relay", "name": "relay_amcl_pose", "use_memo": false, "subscribes": { "value": "amcl_pose" }, "publishes": ["nav/amcl_pose"] }
  # planner_dwa の速度指令 → mobile_sim(localization_amcl の下、2 段下り)
  - { "type_name": "nav_relay", "name": "relay_cmd_vel", "use_memo": false, "subscribes": { "value": "cmd_vel_dwa" }, "publishes": ["cmd_vel"] }
