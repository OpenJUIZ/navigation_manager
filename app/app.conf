# navigation_manager の起動設定
#   ナビゲーション一式の根。localization_amcl(その下に mobile_sim)・planner_dijkstra・planner_dwa を subsystem に持つ。
#   juiz 0.2.4 では葉どうしの間でトピックが中継されないので、葉から上がってきたトピックをここで受けて nav/... の名前で出し直す
#   (experiments/m0_topic_relay)。
#
#   起動の順(根は最後。先に起動すると葉につながらない):
#     1. juiz run mobile_sim
#     2. juiz run localization_amcl                  (mobile_sim の下。今の conf のまま)
#     3. planner_dijkstra・planner_dwa を「navigation_manager の下で動かす」conf で起動(M2 で app/leaves/ に置く。
#        mobile_sim には直接つながない。つなぐと mobile_sim の master が 2 つになり、トピックが届かなくなる)
#     4. cd app && juiz -f app.conf -d
#
#   木の形:
#     navigation_manager ─┬─ localization_amcl ── mobile_sim
#                         ├─ planner_dijkstra
#                         └─ planner_dwa
"name": "navigation_manager"
"option":
  "http_broker":
    "start": true
    "port": 8005
"brokers":
  - "type_name": "ipc"
    "name": "navigation_manager"
"subsystems":
  - "package": "localization_amcl"
    "type_name": "ipc"
    "name": "localization_amcl"
  - "type_name": "ipc"
    "name": "planner_dijkstra"
  - "type_name": "ipc"
    "name": "planner_dwa"
"plugins":
  "components":
    "navigation_manager":
      "language": "rust"
      "path": "plugins/{target}"
"containers":
  - "type_name": "nav_manager"
    "name": "nav_manager0"
    # 名前は ROS の move_base・dwa_local_planner に合わせる
    "xy_goal_tolerance": 0.25
    "yaw_goal_tolerance": 0.35
    "planner_patience": 5.0
    "max_planning_retries": 3
    "processes":
      # ゴールを planner_dijkstra に出す(planner は nav/goal を購読する)
      - "type_name": "nav_set_goal"
        "name": "set_goal0"
        "use_memo": false
        "publishes": ["nav/goal"]
      # キャンセル。0 の速度を mobile_sim に出して止める
      - "type_name": "nav_cancel"
        "name": "cancel0"
        "use_memo": false
        "publishes": ["cmd_vel"]
      - "type_name": "nav_get_status"
        "name": "get_status0"
        "use_memo": false
        "publishes": ["nav_status"]
      # localization_amcl の推定姿勢: 到着の判定に使い、planner・DWA 向けに出し直す
      - "type_name": "nav_on_pose"
        "name": "on_pose0"
        "use_memo": false
        "subscribes": { "pose": "amcl_pose" }
        "publishes": ["nav/amcl_pose"]
      # planner_dijkstra の経路: 成否を見て、DWA 向けに出し直す
      - "type_name": "nav_on_path"
        "name": "on_path0"
        "use_memo": false
        "subscribes": { "path": "path" }
        "publishes": ["nav/path"]
      # planner_dwa の状態: stuck なら経路を引き直す
      - "type_name": "nav_on_local_status"
        "name": "on_local_status0"
        "use_memo": false
        "subscribes": { "status": "dwa_status" }
      # planner_dwa の速度指令: 経路を追っている間だけ mobile_sim に通す
      - "type_name": "nav_gate_cmd"
        "name": "gate_cmd0"
        "use_memo": false
        "subscribes": { "cmd": "cmd_vel_dwa" }
        "publishes": ["cmd_vel"]
# mobile_sim のセンサーを planner_dwa 向けに出し直す
"processes":
  - { "type_name": "nav_relay", "name": "relay_odom", "use_memo": false, "subscribes": { "value": "odom" }, "publishes": ["nav/odom"] }
  - { "type_name": "nav_relay", "name": "relay_scan", "use_memo": false, "subscribes": { "value": "scan" }, "publishes": ["nav/scan"] }
  - { "type_name": "nav_relay", "name": "relay_lidar_mount", "use_memo": false, "subscribes": { "value": "lidar_mount" }, "publishes": ["nav/lidar_mount"] }
"ecs":
  # 状態を出し、経路待ちの時間切れを見る
  - "type_name": "main_loop_ec"
    # main_loop_ec は 1 つのシステムに 1 つだけ
    "name": "main_ec"
    "rate": 2.0
    "bind":
      - { "type_name": "nav_get_status", "name": "get_status0", "container_name": "nav_manager0" }
    "auto_start": true
