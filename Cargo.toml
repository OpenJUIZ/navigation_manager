[workspace]
resolver = "2"
members = ["crates/navigation_hub"]
# M0 の実験(experiments/m0_topic_relay/probe)は別のワークスペース
exclude = ["experiments"]

[workspace.package]
version = "0.3.1"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/OpenJUIZ/navigation_manager"
rust-version = "1.88"

[workspace.dependencies]
# Rust のプラグインは、読み込む juiz と juiz_sdk の版が完全に一致しないと動かない(juiz の docs/spec/app-package.md §4.3)
juiz_sdk = "=0.2.4"
